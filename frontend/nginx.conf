# ---------------------------------------------------------------------------
# ToDoList frontend — SPA hosting + reverse proxy to the Django backend.
#
# Everything is served from a single origin, so the browser never issues a
# cross-origin request and no CORS configuration is needed in production.
#
# Caching contract:
#   /assets/*            immutable, 1 year  (content-hashed filenames)
#   /static/*            public, 30 days    (Django admin / DRF assets)
#   /sw.js, /index.html  never cached       (otherwise a deploy can never land)
#   /manifest.webmanifest  revalidated
# ---------------------------------------------------------------------------
upstream todolist_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # --- compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml font/woff2;

    # --- container healthcheck ---------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- backend proxies ----------------------------------------------------
    # Django sets X-Frame-Options / X-Content-Type-Options / Referrer-Policy
    # itself; hide the upstream copies so each response carries exactly one
    # (the values are identical — see config/settings.py security block).
    location /api/ {
        proxy_pass http://todolist_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /admin/ {
        proxy_pass http://todolist_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Django admin / DRF assets, shared through the `static_data` volume.
    # Served straight from disk instead of proxying to gunicorn.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # --- SPA static assets (content hashed → safe to cache forever) ---------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker, the SW registration shim and the HTML shell must never
    # be cached by the browser, otherwise an installed PWA can never be updated.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Workbox's runtime bundle is imported by sw.js; its name is content-hashed
    # and changes every build, so keep it uncached alongside the SW itself.
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
