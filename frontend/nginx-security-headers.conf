# ---------------------------------------------------------------------------
# Baseline security headers, included by nginx.conf.
#
# Nginx does NOT merge `add_header` across levels: as soon as a `location` block
# declares its own `add_header`, every header inherited from the `server` block
# is dropped. That is why this lives in a snippet and is re-included by every
# location that sets a header of its own.
# ---------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
